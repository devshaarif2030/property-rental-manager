name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations, RLS tests, integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (migrations and seed)
        run: pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
      - name: Lint database functions
        run: pnpm db:lint
      - name: Run pgTAP RLS tests
        run: pnpm db:test
      - name: Check generated database types are current
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
      - name: Run integration tests
        run: |
          status=$(pnpm exec supabase status -o json)
          export NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$status" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')
          export SUPABASE_SECRET_KEY=$(echo "$status" | jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY')
          pnpm test:integration

  e2e:
    name: End-to-end tests and screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase and load the demo data
        run: |
          pnpm exec supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor
          status=$(pnpm exec supabase status -o json)
          psql "$(echo "$status" | jq -r '.DB_URL')" -c "select private.reset_demo_data();"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$status" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')"
            echo "SUPABASE_SECRET_KEY=$(echo "$status" | jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY')"
            # Not real keys. Stripe is never called: the tests sign webhooks with this secret.
            echo "STRIPE_SECRET_KEY=sk_test_e2e_not_a_real_key"
            echo "STRIPE_WEBHOOK_SECRET=whsec_e2e_not_a_real_secret"
          } >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      # Screenshots first, while the demo data is still untouched.
      - run: pnpm screenshots
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14
